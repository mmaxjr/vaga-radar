# Configuração do agregador. Edite à vontade.
# Só entram vagas REMOTAS (as fontes já filtram por isso). Para mudar de área, troque os termos abaixo.

[search]
# Termos usados nas buscas das fontes que têm busca (Gupy, LinkedIn, Vagas.com.br)
terms = [
  "desenvolvedor", "programador", "engenheiro de software", "developer", "backend", "frontend", "full stack",
  "devops", "sre", "infraestrutura", "analista de infraestrutura", "sysadmin", "cloud",
  "redes", "network engineer",
  "segurança da informação", "cybersecurity", "pentest",
]

# A vaga só passa se o título contiver ao menos uma destas (regex, sem diferenciar maiúsculas).
# Palavras curtas usam (?<![a-z])...(?![a-z]) para casar só a palavra inteira.
include = [
  # programação
  'desenvolv', 'programador', 'developer', 'software', 'back-?end', 'front-?end', 'full-?stack',
  '(?<![a-z])dev(?![a-z])', 'python', 'javascript', 'typescript', 'node', 'react', 'angular', 'vue',
  '(?<![a-z])java(?![a-z])', '(?<![a-z])go(?![a-z])', 'golang', 'php', 'ruby', '[.]net', 'c#', 'mobile', 'android', 'flutter',
  'engenheiro de dados', 'data engineer', 'machine learning', 'automação',
  '(?<![a-z])(ti|it)(?![a-z])', 'inform[aá]tica',
  # funções próximas (suporte, sistemas, dados, testes, implantação)
  'suporte t[eé]cnico', 'technical support', 'it support', 'help ?desk', 'service ?desk', 'support engineer',
  'analista de sistemas', 'administrador', 'administrator', 'implanta', 'implementa', 'integra[cç]', '(?<![a-z])qa(?![a-z])',
  '(?<![a-z])(testes?|testing|tester)(?![a-z])', 'dados', '(?<![a-z])data(?![a-z])', '(?<![a-z])rpa(?![a-z])', 'voip', 'telecom', 'engenheiro de',
  # infra / devops / cloud
  'infra', 'devops', 'devsecops', '(?<![a-z])sre(?![a-z])', 'sysadmin', 'sistemas', 'linux', 'kubernetes', 'docker',
  'cloud', '(?<![a-z])aws(?![a-z])', 'azure', 'gcp', 'terraform', 'observabilidade', 'plataforma', 'platform',
  # redes
  'network', 'redes', 'cisco', 'firewall', 'wireless', 'telecom', '(?<![a-z])noc(?![a-z])',
  # segurança
  'seguran[cç]a da informa', 'seguran[cç]a cibern', 'cyber', 'ciberseguran', 'infosec', 'appsec', 'secops',
  '(?<![a-z])soc(?![a-z])', 'pentest', 'security', 'threat', 'siem', 'vulnerab', '(?<![a-z])iam(?![a-z])',
  'seguran[cç]a de (aplica|dados|redes|sistemas|infra)', 'red team', 'blue team', 'purple team', 'gest[aã]o de riscos', '(?<![a-z])risk', 'compliance', 'governan', 'privacidade', 'lgpd',
  '(?<![a-z])grc(?![a-z])', '(?<![a-z])s[.]i(?![a-z])',
  # bancos de dados
  '(?<![a-z])dba(?![a-z])', 'banco de dados', 'database', 'postgres',
]

# Descarta a vaga se o título contiver alguma destas
exclude = [
  'vendas', 'comercial', 'estagi', '(?<![a-z])intern(?![a-z])', 'recrutador', 'marketing',
  # "engenheiro/segurança" de outras áreas
  'civil', 'mec[aâ]nic', 'el[eé]trica', 'el[eé]trico', 'qu[ií]mic', 'mechanical', 'electrical',
  'seguran[cç]a do trabalho', 'seguran[cç]a patrimonial', 'vigilante', 'porteiro',
  'engenheiro de produ', 'engenheiro agr', 'engenheiro florestal', 'engenheiro de alimentos', 'engenheiro de petr',
]

# Fontes que não confirmam o regime da vaga (o filtro "remoto" do LinkedIn falha bastante):
# nelas só entra vaga cujo título ou local diga "remoto"/"home office". Vazio = confia na fonte.
strict_remote_sources = ["linkedin"]

# Ignora vagas publicadas há mais dias que isso
max_age_days = 30

# Vagas internacionais só entram se aceitarem candidatos do Brasil (ou de qualquer lugar)
international_ok_regions = ["worldwide", "anywhere", "global", "latam", "latin america", "americas", "brazil", "brasil", "south america"]

[github]
# Repositórios de vagas da comunidade (issues abertas = vagas)
repos = [
  "frontendbr/vagas",
  "backend-br/vagas",
  "androiddevbr/vagas",
  "react-brasil/vagas",
  "datascience-br/vagas",
  "qa-brasil/vagas",
]
max_pages = 2

[linkedin]
location = "Brazil"
pages_per_term = 2
days = 7
# Pausa entre requisições (segundos) para não tomar bloqueio
delay = 2.5
# Só coleta o LinkedIn de novo depois destas horas (ele dá HTTP 429 com excesso de pedidos). `--force` ignora.
# Vale para qualquer fonte: crie a seção [nome-da-fonte] com min_hours (ex.: [vagascombr]).
min_hours = 6
# terms = ["analista de redes", "python"]   # lista própria do LinkedIn, mais curta que [search] terms

[local]
# Vagas na SUA cidade, em qualquer regime (presencial, híbrido ou remoto). Saem separadas das remotas.
# Desligado por padrão: ligue e troque a cidade. Fontes usadas: Gupy, Vagas.com.br e LinkedIn.
enabled = false
city = "Maringá"
state = "Paraná"
uf = "PR"   # sigla do estado (usada pelo InfoJobs)
# Cidades aceitas no resultado (a busca do LinkedIn traz vizinhas junto)
cities = ["Maringá", "Sarandi", "Paiçandu", "Marialva"]
terms = ["ti", "infraestrutura", "redes", "segurança da informação", "suporte", "desenvolvedor"]
days = 14

[companies]
# Vagas direto das empresas (APIs públicas de quadro de vagas). Só entram vagas que se declarem remotas.
# O "slug" é a parte final do endereço: boards.greenhouse.io/<slug>  ou  jobs.lever.co/<slug>
greenhouse = ["canonical", "datadog", "elastic", "gitlab", "twilio", "remotecom", "coinbase", "stone", "clara", "vtex", "quintoandar"]
lever = []

[zohorecruit]
# Páginas de carreira <nome>.zohorecruit.com (Zoho Recruit). Só vagas marcadas "Trabalho remoto" (e as da sua cidade, se [local] ligado)
sites = ["spassu"]

[jobicy]
geos = ["brazil", "anywhere"]
tags = ["devops", "sre", "infrastructure", "security", "network", "linux"]

[himalayas]
queries = ["devops", "sre", "infrastructure", "security", "network engineer", "linux"]

[geekhunter]
pages_per_term = 2
delay = 1.5

[nerdin]
pages = 5          # ~20 vagas por página, das mais novas para as mais antigas

[trampos]
pages = 5          # 12 vagas por página; o site é mais de comunicação, poucas de TI

[coodesh]
max_jobs = 40      # páginas de vaga lidas a partir do sitemap (1 requisição cada)

[verify]
# Lê a descrição das vagas do LinkedIn que não dizem "remoto" no título, para confirmar o regime
max_per_run = 60
delay = 2.0

[notify]
# Máximo de vagas por resumo (o restante fica só no site/JSON)
max_items = 60

[storage]
path = "docs/jobs.json"
keep_days = 45
# min_hours = 6   # descomente para pular a coleta se a última foi há menos de 6 h (evita HTTP 429)
